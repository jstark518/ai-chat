<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif">
  <defs>
    <linearGradient id="userBubble" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#0066E0"/>
    </linearGradient>
    <linearGradient id="phoneBezel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1c1c1e"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <linearGradient id="dreamGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="dreamBadgeGrad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feFlood flood-color="#8B5CF6" flood-opacity="0.6"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ================= LEFT PHONE: CHAT TAB ================= -->
  <g transform="translate(10, 20)">
    <rect x="0" y="0" width="400" height="840" rx="48" ry="48" fill="url(#phoneBezel)"/>
    <rect x="8" y="8" width="384" height="824" rx="42" ry="42" fill="#000"/>
    <clipPath id="screenL">
      <rect x="12" y="12" width="376" height="816" rx="38" ry="38"/>
    </clipPath>
    <g clip-path="url(#screenL)">
      <rect x="12" y="12" width="376" height="816" fill="#f2f2f7"/>

      <!-- Status bar -->
      <text x="40" y="39" font-size="15" font-weight="600" fill="#000">9:41</text>
      <rect x="150" y="22" width="100" height="32" rx="16" fill="#000"/>
      <g fill="#000">
        <rect x="318" y="33" width="3" height="5" rx="0.5"/>
        <rect x="323" y="30" width="3" height="8" rx="0.5"/>
        <rect x="328" y="27" width="3" height="11" rx="0.5"/>
        <rect x="333" y="24" width="3" height="14" rx="0.5"/>
        <rect x="357" y="28" width="20" height="10" rx="2" fill="none" stroke="#000" stroke-width="1"/>
        <rect x="358" y="29" width="16" height="8" rx="1" fill="#000"/>
      </g>

      <!-- Nav bar -->
      <text x="28" y="90" font-size="22" font-weight="700" fill="#000">Assistant</text>
      <circle cx="145" cy="83" r="4" fill="#34C759"/>
      <text x="154" y="87" font-size="12" fill="#8e8e93">Connected</text>
      <line x1="12" y1="110" x2="388" y2="110" stroke="#d1d1d6" stroke-width="0.5"/>

      <!-- DREAM BADGE — prominent at top -->
      <g transform="translate(28, 126)" filter="url(#glow)">
        <rect x="0" y="0" width="344" height="72" rx="16" fill="url(#dreamGrad)"/>
        <!-- Moon icon -->
        <g transform="translate(18, 18)">
          <circle cx="18" cy="18" r="18" fill="#fff" fill-opacity="0.15"/>
          <path d="M 24 10 a 12 12 0 1 0 8 20 a 10 10 0 0 1 -8 -20 z" fill="#fff"/>
          <circle cx="12" cy="8" r="1" fill="#fff"/>
          <circle cx="30" cy="6" r="1.2" fill="#fff"/>
          <circle cx="28" cy="32" r="0.8" fill="#fff"/>
        </g>
        <text x="66" y="26" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="1.2">DREAM MODE · 3:00 AM</text>
        <text x="66" y="46" font-size="13" font-weight="600" fill="#ffffff">Consolidated 6 memories overnight</text>
        <text x="66" y="60" font-size="11" fill="#ffffff" fill-opacity="0.85">Pruned 2 stale · merged 4 duplicates · 1 new reflection</text>
      </g>

      <!-- Date separator -->
      <text x="200" y="224" font-size="11" font-weight="600" fill="#8e8e93" text-anchor="middle">TODAY 9:12 AM</text>

      <!-- Assistant bubble -->
      <g filter="url(#shadow)">
        <rect x="28" y="238" width="244" height="46" rx="16" fill="#fff"/>
      </g>
      <text x="40" y="258" font-size="14" fill="#000">Good morning! Your 11am DIS</text>
      <text x="40" y="275" font-size="14" fill="#000">update is coming up in 2h.</text>

      <!-- User bubble -->
      <g filter="url(#shadow)">
        <rect x="140" y="298" width="232" height="42" rx="16" fill="url(#userBubble)"/>
      </g>
      <text x="152" y="324" font-size="14" fill="#fff">Add "finish MBA paper" to my todos</text>
      <text x="332" y="356" font-size="10" fill="#8e8e93">Read 9:13 AM</text>

      <!-- Assistant confirmation with task snippet -->
      <g filter="url(#shadow)">
        <rect x="28" y="368" width="280" height="80" rx="16" fill="#fff"/>
      </g>
      <text x="40" y="388" font-size="14" fill="#000">Added to your board.</text>
      <!-- Mini task card preview inside bubble -->
      <rect x="40" y="398" width="256" height="40" rx="8" fill="#f2f2f7" stroke="#e5e5ea" stroke-width="0.5"/>
      <rect x="48" y="406" width="48" height="16" rx="8" fill="#8e8e93"/>
      <text x="72" y="417" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">TO DO</text>
      <text x="104" y="418" font-size="12" font-weight="500" fill="#000">Finish MBA paper</text>
      <text x="104" y="431" font-size="10" fill="#8e8e93">Just added</text>

      <!-- Assistant smart home card -->
      <g filter="url(#shadow)">
        <rect x="28" y="462" width="280" height="106" rx="16" fill="#fff"/>
      </g>
      <text x="40" y="482" font-size="11" font-weight="600" fill="#8e8e93">OFFICE</text>
      <line x1="40" y1="490" x2="296" y2="490" stroke="#e5e5ea" stroke-width="0.5"/>
      <!-- Light 1 -->
      <circle cx="54" cy="510" r="9" fill="#FFD60A"/>
      <text x="70" y="507" font-size="12" font-weight="500" fill="#000">Desk Light</text>
      <text x="70" y="520" font-size="10" fill="#8e8e93">On · 80%</text>
      <rect x="252" y="502" width="32" height="18" rx="9" fill="#34C759"/>
      <circle cx="275" cy="511" r="7" fill="#fff"/>
      <!-- Light 2 -->
      <circle cx="54" cy="540" r="9" fill="#e5e5ea"/>
      <text x="70" y="537" font-size="12" font-weight="500" fill="#000">Floor Lamp</text>
      <text x="70" y="550" font-size="10" fill="#8e8e93">Off</text>
      <rect x="252" y="532" width="32" height="18" rx="9" fill="#e5e5ea"/>
      <circle cx="261" cy="541" r="7" fill="#fff"/>

      <!-- User bubble -->
      <g filter="url(#shadow)">
        <rect x="162" y="586" width="210" height="42" rx="16" fill="url(#userBubble)"/>
      </g>
      <text x="174" y="612" font-size="14" fill="#fff">How's my stock vest looking?</text>

      <!-- Typing indicator -->
      <g filter="url(#shadow)">
        <rect x="28" y="642" width="56" height="30" rx="15" fill="#fff"/>
        <circle cx="42" cy="657" r="3.2" fill="#8e8e93" opacity="0.4"/>
        <circle cx="56" cy="657" r="3.2" fill="#8e8e93" opacity="0.7"/>
        <circle cx="70" cy="657" r="3.2" fill="#8e8e93"/>
      </g>

      <!-- Compose bar -->
      <line x1="12" y1="700" x2="388" y2="700" stroke="#d1d1d6" stroke-width="0.5"/>
      <rect x="12" y="700" width="376" height="128" fill="#f2f2f7"/>
      <rect x="28" y="714" width="304" height="36" rx="18" fill="#fff" stroke="#d1d1d6" stroke-width="0.5"/>
      <text x="42" y="737" font-size="14" fill="#c7c7cc">Message…</text>
      <circle cx="358" cy="732" r="17" fill="#0A84FF"/>
      <path d="M 351 732 L 365 732 M 360 727 L 365 732 L 360 737" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

      <!-- Tab bar -->
      <line x1="12" y1="762" x2="388" y2="762" stroke="#d1d1d6" stroke-width="0.5"/>
      <rect x="12" y="762" width="376" height="66" fill="#f2f2f7"/>
      <!-- Chat tab (active) -->
      <g transform="translate(92, 774)">
        <path d="M 8 4 Q 8 0 12 0 L 24 0 Q 28 0 28 4 L 28 14 Q 28 18 24 18 L 16 18 L 12 22 L 12 18 Q 8 18 8 14 Z" fill="#0A84FF"/>
        <text x="18" y="36" font-size="10" font-weight="600" fill="#0A84FF" text-anchor="middle">Chat</text>
      </g>
      <!-- Tasks tab (inactive) -->
      <g transform="translate(248, 774)">
        <rect x="8" y="0" width="20" height="22" rx="2" fill="none" stroke="#8e8e93" stroke-width="1.5"/>
        <line x1="12" y1="6" x2="24" y2="6" stroke="#8e8e93" stroke-width="1.5"/>
        <line x1="12" y1="11" x2="24" y2="11" stroke="#8e8e93" stroke-width="1.5"/>
        <line x1="12" y1="16" x2="20" y2="16" stroke="#8e8e93" stroke-width="1.5"/>
        <text x="18" y="36" font-size="10" fill="#8e8e93" text-anchor="middle">Tasks</text>
      </g>

      <!-- Home indicator -->
      <rect x="140" y="818" width="120" height="5" rx="2.5" fill="#000"/>
    </g>
  </g>

  <!-- ================= RIGHT PHONE: TASKS TAB ================= -->
  <g transform="translate(490, 20)">
    <rect x="0" y="0" width="400" height="840" rx="48" ry="48" fill="url(#phoneBezel)"/>
    <rect x="8" y="8" width="384" height="824" rx="42" ry="42" fill="#000"/>
    <clipPath id="screenR">
      <rect x="12" y="12" width="376" height="816" rx="38" ry="38"/>
    </clipPath>
    <g clip-path="url(#screenR)">
      <rect x="12" y="12" width="376" height="816" fill="#f2f2f7"/>

      <!-- Status bar -->
      <text x="40" y="39" font-size="15" font-weight="600" fill="#000">9:41</text>
      <rect x="150" y="22" width="100" height="32" rx="16" fill="#000"/>
      <g fill="#000">
        <rect x="318" y="33" width="3" height="5" rx="0.5"/>
        <rect x="323" y="30" width="3" height="8" rx="0.5"/>
        <rect x="328" y="27" width="3" height="11" rx="0.5"/>
        <rect x="333" y="24" width="3" height="14" rx="0.5"/>
        <rect x="357" y="28" width="20" height="10" rx="2" fill="none" stroke="#000" stroke-width="1"/>
        <rect x="358" y="29" width="16" height="8" rx="1" fill="#000"/>
      </g>

      <!-- Nav bar -->
      <text x="28" y="90" font-size="22" font-weight="700" fill="#000">Tasks</text>
      <line x1="12" y1="110" x2="388" y2="110" stroke="#d1d1d6" stroke-width="0.5"/>

      <!-- === TODO column === -->
      <rect x="24" y="130" width="352" height="196" rx="14" fill="#e5e5ea" fill-opacity="0.5"/>
      <text x="40" y="152" font-size="11" font-weight="700" fill="#8e8e93" letter-spacing="1">TO DO</text>
      <text x="354" y="152" font-size="11" fill="#8e8e93" text-anchor="end">3</text>

      <!-- Card 1 -->
      <g filter="url(#shadow)">
        <rect x="36" y="162" width="328" height="44" rx="10" fill="#fff"/>
      </g>
      <text x="48" y="182" font-size="13" font-weight="500" fill="#000">Finish MBA paper</text>
      <text x="48" y="198" font-size="10" fill="#8e8e93">C200 leadership evaluation</text>

      <!-- Card 2 -->
      <g filter="url(#shadow)">
        <rect x="36" y="212" width="328" height="38" rx="10" fill="#fff"/>
      </g>
      <text x="48" y="232" font-size="13" font-weight="500" fill="#000">Book dentist appointment</text>

      <!-- Card 3 -->
      <g filter="url(#shadow)">
        <rect x="36" y="256" width="328" height="38" rx="10" fill="#fff"/>
      </g>
      <text x="48" y="276" font-size="13" font-weight="500" fill="#000">Renew car registration</text>

      <!-- Add field -->
      <rect x="36" y="300" width="328" height="20" rx="6" fill="#f2f2f7" stroke="#d1d1d6" stroke-width="0.5"/>
      <text x="48" y="315" font-size="11" fill="#8e8e93">+ Add task</text>

      <!-- === DOING column === -->
      <rect x="24" y="338" width="352" height="162" rx="14" fill="#e5e5ea" fill-opacity="0.5"/>
      <text x="40" y="360" font-size="11" font-weight="700" fill="#0A84FF" letter-spacing="1">DOING</text>
      <text x="354" y="360" font-size="11" fill="#8e8e93" text-anchor="end">2</text>

      <!-- Card 1 -->
      <g filter="url(#shadow)">
        <rect x="36" y="370" width="328" height="58" rx="10" fill="#fff"/>
      </g>
      <text x="48" y="390" font-size="13" font-weight="500" fill="#000">Disney WDI application follow-up</text>
      <text x="48" y="406" font-size="10" fill="#8e8e93">Req 10142497 · "under review" since</text>
      <text x="48" y="419" font-size="10" fill="#8e8e93">4/4 · check in next week</text>

      <!-- Card 2 -->
      <g filter="url(#shadow)">
        <rect x="36" y="434" width="328" height="38" rx="10" fill="#fff"/>
      </g>
      <text x="48" y="454" font-size="13" font-weight="500" fill="#000">iOS push notifications (APNS)</text>

      <!-- Add field -->
      <rect x="36" y="478" width="328" height="20" rx="6" fill="#f2f2f7" stroke="#d1d1d6" stroke-width="0.5"/>
      <text x="48" y="493" font-size="11" fill="#8e8e93">+ Add task</text>

      <!-- === DONE column === -->
      <rect x="24" y="512" width="352" height="178" rx="14" fill="#e5e5ea" fill-opacity="0.5"/>
      <text x="40" y="534" font-size="11" font-weight="700" fill="#34C759" letter-spacing="1">DONE</text>
      <text x="354" y="534" font-size="11" fill="#8e8e93" text-anchor="end">3</text>

      <!-- Card 1 -->
      <g filter="url(#shadow)">
        <rect x="36" y="544" width="328" height="38" rx="10" fill="#fff" fill-opacity="0.7"/>
      </g>
      <text x="48" y="564" font-size="13" fill="#8e8e93" text-decoration="line-through">Get iOS app on real phone</text>

      <!-- Card 2 -->
      <g filter="url(#shadow)">
        <rect x="36" y="588" width="328" height="38" rx="10" fill="#fff" fill-opacity="0.7"/>
      </g>
      <text x="48" y="608" font-size="13" fill="#8e8e93" text-decoration="line-through">Wire up Govee cloud API</text>

      <!-- Card 3 -->
      <g filter="url(#shadow)">
        <rect x="36" y="632" width="328" height="38" rx="10" fill="#fff" fill-opacity="0.7"/>
      </g>
      <text x="48" y="652" font-size="13" fill="#8e8e93" text-decoration="line-through">Add kanban board</text>

      <!-- Tab bar -->
      <line x1="12" y1="762" x2="388" y2="762" stroke="#d1d1d6" stroke-width="0.5"/>
      <rect x="12" y="762" width="376" height="66" fill="#f2f2f7"/>
      <!-- Chat tab (inactive) -->
      <g transform="translate(92, 774)">
        <path d="M 8 4 Q 8 0 12 0 L 24 0 Q 28 0 28 4 L 28 14 Q 28 18 24 18 L 16 18 L 12 22 L 12 18 Q 8 18 8 14 Z" fill="none" stroke="#8e8e93" stroke-width="1.5"/>
        <text x="18" y="36" font-size="10" fill="#8e8e93" text-anchor="middle">Chat</text>
      </g>
      <!-- Tasks tab (active) -->
      <g transform="translate(248, 774)">
        <rect x="8" y="0" width="20" height="22" rx="2" fill="none" stroke="#0A84FF" stroke-width="2"/>
        <line x1="12" y1="6" x2="24" y2="6" stroke="#0A84FF" stroke-width="2"/>
        <line x1="12" y1="11" x2="24" y2="11" stroke="#0A84FF" stroke-width="2"/>
        <line x1="12" y1="16" x2="20" y2="16" stroke="#0A84FF" stroke-width="2"/>
        <text x="18" y="36" font-size="10" font-weight="600" fill="#0A84FF" text-anchor="middle">Tasks</text>
      </g>

      <!-- Home indicator -->
      <rect x="140" y="818" width="120" height="5" rx="2.5" fill="#000"/>
    </g>
  </g>
</svg>
